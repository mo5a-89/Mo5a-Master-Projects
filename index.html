    <script>
      // Gracefully handle Vite development client in AI Studio sandbox where HMR is disabled
      (function() {
        // 1. Provide an inert mock WebSocket for Vite HMR so connection promises resolve cleanly
        const NativeWebSocket = window.WebSocket;
        if (typeof EventTarget !== 'undefined') {
          class MockViteHmrSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              this.url = String(url);
              this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
              this.readyState = 0; // CONNECTING
              this.onopen = null;
              this.onclose = null;
              this.onerror = null;
              this.onmessage = null;

              setTimeout(() => {
                this.readyState = 1; // OPEN
                const openEvent = new Event('open');
                if (typeof this.onopen === 'function') this.onopen(openEvent);
                this.dispatchEvent(openEvent);
              }, 5);
            }

            send() {}

            close(code, reason) {
              this.readyState = 3; // CLOSED
              const closeEvent = typeof CloseEvent !== 'undefined' ? new CloseEvent('close', { code: code || 1000 }) : new Event('close');
              if (typeof this.onclose === 'function') this.onclose(closeEvent);
              this.dispatchEvent(closeEvent);
            }
          }

          window.WebSocket = function(url, protocols) {
            const isViteHmr =
              (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr'))) ||
              (typeof url === 'string' && (url.includes(':24678') || url.includes('token=')));
            if (isViteHmr) {
              return new MockViteHmrSocket(url, protocols);
            }
            return NativeWebSocket ? new NativeWebSocket(url, protocols) : {};
          };
          if (NativeWebSocket) {
            window.WebSocket.prototype = NativeWebSocket.prototype;
          }
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Defensive handling for browser extensions & third-party content scripts
        if (typeof window.chrome === 'undefined') {
          try {
            window.chrome = {};
          } catch (_) {}
        }
        if (window.chrome && !window.chrome.runtime) {
          try {
            window.chrome.runtime = {
              sendMessage: function() {
                return Promise.resolve();
              },
              connect: function() {
                return {
                  onMessage: { addListener: function() {} },
                  onDisconnect: { addListener: function() {} },
                  postMessage: function() {},
                  disconnect: function() {}
                };
              },
              id: 'rmt-applet-mock'
            };
          } catch (_) {}
        } else if (window.chrome && window.chrome.runtime) {
          const origSendMessage = window.chrome.runtime.sendMessage;
          if (typeof origSendMessage === 'function') {
            window.chrome.runtime.sendMessage = function(...msgArgs) {
              try {
                const res = origSendMessage.apply(window.chrome.runtime, msgArgs);
                if (res && typeof res.catch === 'function') {
                  return res.catch((_) => {});
                }
                return res;
              } catch (_) {
                return Promise.resolve();
              }
            };
          }
        }

        // 3. Clean up any stale service workers in development iframe to prevent request hijacking
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let reg of registrations) {
              reg.unregister();
            }
          }).catch(function() {});
        }

        // 4. Intercept and isolate any Vite HMR or browser extension injected errors
        const origError = console.error;
        const origWarn = console.warn;
        function isBenignErrorLog(args) {
          if (!args || !args.length) return false;
          for (let i = 0; i < args.length; i++) {
            const item = args[i];
            const str = typeof item === 'string' ? item : (item && typeof item.message === 'string' ? item.message : '');
            if (
              str.includes('[vite]') ||
              str.includes('WebSocket') ||
              str.includes('websocket') ||
              str.includes('Could not establish connection') ||
              str.includes('Receiving end does not exist') ||
              str.includes('serviceName') ||
              str.includes('chrome-extension://') ||
              str.includes('content.js')
            ) {
              return true;
            }
          }
          return false;
        }
        console.error = function(...args) {
          if (isBenignErrorLog(args)) {
            console.debug(...args);
            return;
          }
          origError.apply(console, args);
        };
        console.warn = function(...args) {
          if (isBenignErrorLog(args)) {
            console.debug(...args);
            return;
          }
          origWarn.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event && event.reason;
          const msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('[vite]') ||
            msg.includes('Could not establish connection') ||
            msg.includes('Receiving end does not exist') ||
            msg.includes('serviceName') ||
            msg.includes('chrome-extension://')
          ) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
        window.addEventListener('error', function(event) {
          const msg = event && event.message ? String(event.message) : '';
          const filename = event && event.filename ? String(event.filename) : '';
          if (
            msg.includes('serviceName') ||
            msg.includes('Could not establish connection') ||
            filename.includes('content.js') ||
            filename.includes('chrome-extension://')
          ) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      })();
    </script>

        <!-- Modern Corporate Progress Bar -->
        <div style="width: 240px; height: 4px; background: rgba(255, 255, 255, 0.08); border-radius: 9999px; overflow: hidden; position: relative; margin-bottom: 24px;">

        </div>

        <!-- Emergency Storage Reset / Refresh -->
        <button onclick="localStorage.clear();sessionStorage.clear();if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}window.location.reload();" style="background: rgba(30, 41, 59, 0.6); color: #38bdf8; border: 1px solid rgba(51, 65, 85, 0.8); padding: 6px 14px; border-radius: 8px; font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.2s ease;">
          🔄 إعادة تعيين الذاكرة وتحديث الصفحة
