    <text y="38" fill="#4B5563" font-size="13" font-weight="500">Kingdom of Saudi Arabia, Dammam, Al Shate Al gharbi</text>
    <text y="58" fill="#4B5563" font-size="12" font-weight="500">Phone: +966 549220606 | Email:info@rmt-sa.com</text>
    <text y="78" fill="#4B5563" font-size="12" font-weight="600">CR. NO. 2050167793   VAT NO. 311552664400003</text>
  </g>

  <!-- Bottom: Solid Green Dividing Line -->
  <line x1="0" y1="120" x2="1000" y2="120" stroke="#00A859" stroke-width="4" stroke-linecap="round" />
