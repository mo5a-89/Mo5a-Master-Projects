    <path fill-rule="evenodd" clip-rule="evenodd" d="M 32 14 L 70 14 C 82 14 88 20 88 34 C 88 48 82 54 70 54 L 32 54 Z M 32 26 L 66 26 C 72 26 74 28 74 34 C 74 40 72 42 66 42 L 32 42 Z" fill="#00A859" />
