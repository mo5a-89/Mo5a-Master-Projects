      <stop offset="0%" stop-color="#00A859" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="rmt-bridge-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#1E5AA0" />
      <stop offset="100%" stop-color="#174A84" />
    </linearGradient>
  </defs>

  <!-- Left: Stylized Monogram Logo RM -->
